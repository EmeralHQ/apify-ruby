name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

# Solo lectura del repo: la CI no escribe nada. Publicar es un acto explícito
# (tag + rake release), nunca un efecto de mergear.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior; en main se dejan
# terminar todas para no perder el historial de checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
